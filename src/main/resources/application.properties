spring.application.name=hospital-manager
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Secret must be at least 48 characters -> HS384
app.jwt.secret=HospitalManagerSuperSecretKeyForJwtSigning-HS384-0123456789
app.jwt.expiration-ms=3600000